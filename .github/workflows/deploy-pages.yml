name: Atualizar Dados ML & Publicar GitHub Pages

on:
  push:
    branches: ["main"]
  schedule:
    # Atualiza automaticamente a cada 6 horas (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: "0 */6 * * *"
  workflow_dispatch: # Permite rodar manualmente pelo botão "Run workflow" no GitHub

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      - name: Atualizar arquivo de dados (public/data/meli-snapshot.json)
        env:
          MELI_APP_ID: ${{ secrets.MELI_APP_ID }}
          MELI_CLIENT_SECRET: ${{ secrets.MELI_CLIENT_SECRET }}
          MELI_SITE_ID: MLB
        run: npm run update-data

      - name: Commit e Push do arquivo de dados atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/meli-snapshot.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(data): atualizar snapshot do Mercado Livre [skip ci]"
            git push
          else
            echo "Nenhuma alteração nos dados."
          fi

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Gerar build estático (Next.js export -> out/)
        run: npm run build

      - name: Upload do artefato para o GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./out"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: update-and-build
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

