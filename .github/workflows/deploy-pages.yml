name: Atualizar Dados ML na main (GitHub Pages)

on:
  schedule:
    # Atualiza automaticamente a cada 6 horas (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout da branch main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configurar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Instalar dependências (registry oficial npmjs)
        run: npm install --no-audit --no-fund --registry=https://registry.npmjs.org

      - name: Atualizar arquivo de dados (public/data/meli-snapshot.json)
        env:
          MELI_APP_ID: ${{ secrets.MELI_APP_ID }}
          MELI_CLIENT_SECRET: ${{ secrets.MELI_CLIENT_SECRET }}
          MELI_SITE_ID: MLB
        run: |
          if [ -n "$MELI_APP_ID" ] && [ -n "$MELI_CLIENT_SECRET" ]; then
            npm run update-data
          else
            echo "Secrets MELI_APP_ID/MELI_CLIENT_SECRET ainda não configurados; mantendo snapshot atual."
          fi

      - name: Gerar build estático direto na raiz da main
        run: npm run build

      - name: Commit e Push direto na main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/meli-snapshot.json index.html 404.html _next .nojekyll
          if ! git diff --staged --quiet; then
            git commit -m "chore(data): atualizar snapshot e site estático na main"
            git push origin main
          else
            echo "Nenhuma alteração nos dados."
          fi
